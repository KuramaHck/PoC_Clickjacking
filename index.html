<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>💣 Clickjacking PoC - Página Y</title>

  <link rel="stylesheet" href="PoC.css" />
</head>

<body>

  <!-- Barra de carregamento -->
  <div id="loadingBar"></div>

  <!-- Painel -->
  <div id="controlPanel">

    <input
      id="targetUrl"
      type="url"
      placeholder="https://site-alvo.com.br/"
    />

    <button id="loadTarget">
      Carregar
    </button>

    <span id="targetStatus">
      Aguardando URL...
    </span>

    <span id="targetDisplay"></span>

  </div>

  <!-- Site alvo -->
  <iframe
    id="targetFrame"
    src="about:blank">
  </iframe>

  <!-- Imagem específica da Página Y -->
  <img
    id="pocImage"
    src="assets/indexB.jpg"
    alt="Imagem da PoC"
  />

  <!-- Elemento interativo sobreposto -->
  <a
    id="redirectLink"
    href="https://example.com/"
    target="_blank"
  >
    CLIQUE AQUI
  </a>

  <!-- Configuração específica da Página Y -->
  <script>

    window.POC_CONFIG = {

      baseWidth: 1920,
      baseHeight: 1080,

      targetX: 1120,
      targetY: 420,

      linkOffsetX: -60,
      linkOffsetY: -15
    };

  </script>

  <script src="Poc.js"></script>

</body>

</html>
