<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>💣 Clickjacking PoC</title>

  <link rel="stylesheet" href="poc.css" />
</head>

<body>

  <!-- Barra de carregamento -->
  <div id="loadingBar"></div>


  <!-- Painel -->
  <div id="controlPanel">

    <input
      id="targetUrl"
      type="url"
      placeholder="https://site-alvo.com.br/"
    />

    <button id="loadTarget">
      Carregar
    </button>

    <button id="toggleImage">
      Mostar imagem
    </button>

    <button id="toggleDrag">
      Posicionar botão
    </button>

    <span id="targetStatus">
      Aguardando URL...
    </span>

    <span id="targetDisplay"></span>

    <span id="coordinates">
      X: 0 | Y: 0
    </span>

  </div>


  <!-- Site alvo -->
  <iframe
    id="targetFrame"
    src="about:blank">
  </iframe>


  <!-- Imagem -->
  <img
    id="pocImage"
    src="assets/manutencao.jpg"
    alt="Imagem da PoC"
    style="display: none;
  />


  <!-- Elemento sobreposto -->
  <a
    id="redirectLink"
    href="https://example.com/"
    target="_blank"
  >
    CLIQUE AQUI
  </a>


  <!-- Configuração -->
  <script>

    window.POC_CONFIG = {

      baseWidth: 1920,
      baseHeight: 1080,

      targetX: 960,
      targetY: 580,

      linkOffsetX: -80,
      linkOffsetY: -20

    };

  </script>


  <script src="poc.js"></script>

</body>

</html>
